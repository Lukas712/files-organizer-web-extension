<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>File Organizer Web Extension</title>
    <link rel="stylesheet" href="./ui/styles/style.css" />
  </head>
  <body>
    <div id="toast-container"></div>
    <div id="app" class="container">
      <header class="header">
        <h1 class="title">📂 File Organizer</h1>

        <div class="header-controls">
          <div class="dropdown">
            <button class="icon-btn ghost" title="Ajuda">❓</button>
            <div class="dropdown-menu">
              <a href="#" id="menuChangelog">📝 Changelog</a>
              <a href="#" id="menuAbout">ℹ️ About</a>
              <a href="#" id="menuHelp">🆘 Help</a>
            </div>
          </div>

          <button
            id="btnToggleTheme"
            class="icon-btn ghost theme-toggle"
            title="Alternar tema"
            aria-label="Alternar modo claro/escuro"
          >
            🌙
          </button>
        </div>
      </header>

      <div class="workspace" role="application">
        <section
          class="panel left-panel full-height"
          aria-label="Navegador de arquivos"
        >
          <div class="left-top" role="toolbar" aria-label="Ações">
            <button id="btnNewFolder" class="icon-btn" title="Criar pasta">
              📁
            </button>
            <button id="btnNewFile" class="icon-btn" title="Criar arquivo">
              📄
            </button>
            <button id="btnDelete" class="icon-btn" title="Deletar selecionado">
              🗑️
            </button>
          </div>

          <div class="left-bottom" role="tree">
            <ul id="treeRoot" class="tree" aria-label="Árvore de arquivos"></ul>
          </div>
        </section>

        <section
          class="panel right-panel full-height"
          aria-label="Propriedades"
        >
          <form id="propsForm" novalidate class="right-form">
            <div class="form-scroll" id="formScroll">
              <div id="noSelection">
                Selecione um arquivo ou pasta à esquerda para editar suas
                propriedades.
              </div>

              <div id="folderForm" style="display: none">
                <div class="form-group input-group" data-title="Nome da pasta">
                  <label for="fldName">Nome da pasta</label>
                  <input
                    id="fldName"
                    type="text"
                    placeholder="Ex: Minha Pasta"
                    autocomplete="off"
                  />
                </div>

                <div class="form-group checkbox">
                  <input id="fldEnabled" type="checkbox" />
                  <label for="fldEnabled">Habilitado</label>
                </div>

                <div class="form-group">
                  <label for="fldConflict">Ação de conflito</label>
                  <select id="fldConflict">
                    <option value="uniquify">Renomear (uniquify)</option>
                    <option value="overwrite">Sobrescrever</option>
                    <option value="">(nenhuma)</option>
                  </select>
                </div>

                <hr />

                <div class="form-group">
                  <div class="note">Regras de arquivo (JSON)</div>
                  <textarea
                    id="fldFileRules"
                    rows="6"
                    placeholder='[ { "ext": ".png", "folder": "Images" } ]'
                  ></textarea>
                </div>
              </div>

              <div id="fileForm" style="display: none">
                <div
                  class="form-group input-group"
                  data-title="Name of the rule"
                >
                  <label for="fileRuleName">Rule Name</label>
                  <input id="fileRuleName" type="text" />
                </div>

                <div class="form-group">
                  <label for="fileRuleDescription">Rule Description</label>
                  <input id="fileRuleDescription" type="text" />
                </div>
                <div class="form-group checkbox">
                  <input id="fileEnabled" type="checkbox" />
                  <label for="fileEnabled">Habilitado</label>
                </div>

                <div class="FormDiv">
                  <div
                    class="form-group input-group suggest-container"
                    data-title="Ex: .png, .zip, * (curinga)"
                  >
                    <label for="fileExt">Extension</label>
                    <input
                      id="fileExt"
                      type="text"
                      placeholder=".png, .txt"
                      autocomplete="off"
                    />
                    <div class="custom-suggestions" id="listExt">
                      <div class="suggest-item" data-value="*">
                        Qualquer extensão (*)
                      </div>
                      <div class="suggest-item" data-value="png">png</div>
                      <div class="suggest-item" data-value="jpg">jpg</div>
                      <div class="suggest-item" data-value="zip">zip</div>
                    </div>
                  </div>

                  <div
                    class="form-group input-group suggest-container"
                    data-title="Ex: image/*, application/pdf"
                  >
                    <label for="fileMime">MIME</label>
                    <input
                      id="fileMime"
                      type="text"
                      placeholder="image/png"
                      autocomplete="off"
                    />
                    <div class="custom-suggestions" id="listMime">
                      <div class="suggest-item" data-value="image/*">
                        Todas as Imagens (image/*)
                      </div>
                      <div class="suggest-item" data-value="video/*">
                        Todos os Vídeos (video/*)
                      </div>
                      <div class="suggest-item" data-value="application/*">
                        Aplicações (application/*)
                      </div>
                    </div>
                  </div>
                </div>
                <div
                  class="form-group input-group"
                  data-title="Referrer of the file"
                >
                  <label for="fileRef">Referrer</label>
                  <input id="fileRef" type="text" />
                </div>

                <div class="form-group" data-title="URL of the file">
                  <label for="fileUrl">URL</label>
                  <input id="fileUrl" type="text" />
                </div>

                <div
                  class="form-group input-group"
                  data-title="Final URL of the file"
                >
                  <label for="fileFinalUrl">Final URL</label>
                  <input id="fileFinalUrl" type="text" />
                </div>

                <div class="FormDiv">
                  <div
                    class="form-group input-group"
                    data-title="Name of the file"
                  >
                    <label for="fileName">File Name</label>
                    <input id="fileName" type="text" />
                  </div>
                  <div
                    class="form-group input-group"
                    data-title="Date/Time of the file"
                  >
                    <label for="fileDate">Date/Time</label>
                    <input id="fileDate" type="date" />
                  </div>
                </div>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" id="btnSave" class="save">
                Salvar alterações
              </button>
            </div>
          </form>
        </section>
      </div>
    </div>

    <script type="module" src="../dist/src/ui/index.js"></script>
  </body>
</html>
