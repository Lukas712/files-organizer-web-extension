<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>File Organizer Web Extension</title>
    <link rel="stylesheet" href="./ui/styles/style.css" />
  </head>
  <body>
    <div id="toast-container"></div>
    <div id="app" class="container">
      <header class="header">
        <h1 class="title">File Organizer Web Extension</h1>

        <button
          id="btnToggleTheme"
          class="icon-btn theme-toggle"
          title="Alternar tema"
          aria-label="Alternar modo claro/escuro"
        >
          🌙
        </button>
      </header>

      <div class="workspace" role="application">
        <section
          class="panel left-panel full-height"
          aria-label="Navegador de arquivos"
        >
          <div class="left-top" role="toolbar" aria-label="Ações">
            <button id="btnNewFolder" class="icon-btn" title="Criar pasta">
              📁
            </button>
            <button id="btnNewFile" class="icon-btn" title="Criar arquivo">
              📄
            </button>
            <button id="btnDelete" class="icon-btn" title="Deletar selecionado">
              🗑️
            </button>
          </div>

          <div class="left-bottom" role="tree">
            <ul id="treeRoot" class="tree" aria-label="Árvore de arquivos"></ul>
          </div>
        </section>

        <section
          class="panel right-panel full-height"
          aria-label="Propriedades"
        >
          <form id="propsForm" novalidate class="right-form">
            <div class="form-scroll" id="formScroll">
              <div id="noSelection">
                Selecione um arquivo ou pasta à esquerda para editar suas
                propriedades.
              </div>

              <div id="folderForm" style="display: none">
                <label for="fldName">Nome da pasta</label>
                <input id="fldName" type="text" />

                <div class="checkbox">
                  <input id="fldEnabled" type="checkbox" /><label
                    for="fldEnabled"
                    >Habilitado</label
                  >
                </div>
                <div class="checkbox">
                  <input id="fldAutoOrg" type="checkbox" /><label
                    for="fldAutoOrg"
                    >Auto Organize</label
                  >
                </div>

                <label for="fldConflict">Ação de conflito</label>
                <select id="fldConflict">
                  <option value="uniquify">uniquify</option>
                  <option value="">(nenhuma)</option>
                </select>

                <hr />
                <div class="note">
                  Regras de arquivo (exibe resumo; edição avançada em JSON)
                </div>
                <textarea
                  id="fldFileRules"
                  rows="6"
                  placeholder="[]"
                ></textarea>
              </div>

              <div id="fileForm" style="display: none">
                <label for="fileRuleName">Rule Name</label>
                <input id="fileRuleName" type="text" />

                <label for="fileRuleDescription">Rule Description</label>
                <input id="fileRuleDescription" type="text" />

                <label for="fileExt">Extension</label>
                <input id="fileExt" type="text" placeholder=".png, .txt" />

                <label for="fileMime">MIME</label>
                <input id="fileMime" type="text" placeholder="image/png" />

                <label for="fileRef">Referrer</label>
                <input id="fileRef" type="text" />

                <label for="fileUrl">URL</label>
                <input id="fileUrl" type="text" />

                <label for="fileFinalUrl">Final URL</label>
                <input id="fileFinalUrl" type="text" />

                <label for="fileName">File Name</label>
                <input id="fileName" type="text" />

                <label for="fileDate">Date/Time</label>
                <input id="fileDate" type="datetime-local" />
              </div>
            </div>

            <div class="form-actions">
              <button type="button" id="btnSave" class="save">
                Salvar alterações
              </button>
            </div>
          </form>
        </section>
      </div>
    </div>

    <script type="module" src="../dist/src/ui/index.js"></script>
  </body>
</html>
